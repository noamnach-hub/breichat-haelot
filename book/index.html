<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קביעת תור | בריכת האלות</title>
<meta name="description" content="בקשה לתור לטיפול וואטסו או לטיפול זוגי במים בבריכת האלות, מושב טל שחר.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Miriam+Libre:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="book.css">
</head>
<body class="book-page">

<header class="book-top">
  <div class="wrap bar">
    <a class="brand" href="../">בריכת האלות</a>
    <a class="back" href="../">חזרה לאתר</a>
  </div>
</header>

<main class="wrap book" id="main">
  <h1>קביעת תור</h1>
  <p class="lead">בוחרים טיפול, יום ושעה פנויה. זו בקשה: יהל תחזור אליכם לאישור.</p>

  <section class="step" id="stepTreat">
    <h2><span class="num">1</span>איזה טיפול?</h2>
    <div class="choices" id="treatments"><p class="note">טוען…</p></div>
  </section>

  <section class="step" id="stepDay" hidden>
    <h2><span class="num">2</span>באיזה יום?</h2>
    <div class="days" id="days" role="listbox" aria-label="ימים"></div>
    <p class="note" id="daysNote"></p>
  </section>

  <section class="step" id="stepTime" hidden>
    <h2><span class="num">3</span>באיזו שעה?</h2>
    <div class="times" id="times"></div>
  </section>

  <section class="step" id="stepForm" hidden>
    <h2><span class="num">4</span>הפרטים שלך</h2>
    <p class="summary" id="summary"></p>
    <form id="form" novalidate>
      <label><span>שם מלא</span><input name="name" required autocomplete="name"></label>
      <label><span>טלפון נייד</span><input name="phone" type="tel" inputmode="tel" required autocomplete="tel"></label>
      <label><span>מייל <small>(לא חובה)</small></span><input name="email" type="email" autocomplete="email"></label>
      <label><span>משהו שחשוב שיהל תדע? <small>(לא חובה)</small></span><textarea name="note" rows="3"></textarea></label>
      <label class="hp" aria-hidden="true">אתר<input name="website" tabindex="-1" autocomplete="off"></label>
      <p class="err" id="formErr" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="send">שליחת הבקשה</button>
    </form>
  </section>

  <section class="done" id="done" hidden>
    <h2>הבקשה נשלחה</h2>
    <p id="doneText"></p>
    <p>יהל תחזור אליך לאישור. זו עדיין לא קביעה סופית.</p>
    <a class="btn btn-ghost" href="../">חזרה לאתר</a>
  </section>

  <p class="fallback">מעדיפים לדבר? <a href="https://wa.me/972523215057?text=%D7%94%D7%99%D7%99%20%D7%99%D7%94%D7%9C%2C%20%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%AA%D7%90%D7%9D%20%D7%98%D7%99%D7%A4%D7%95%D7%9C" target="_blank" rel="noopener">כתבו ליהל בוואטסאפ</a></p>
</main>

<script src="book.js"></script>
</body>
</html>
